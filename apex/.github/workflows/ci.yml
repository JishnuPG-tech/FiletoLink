name: Apex CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  python:
    name: Python Syntax & Import Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest pytest-asyncio

      - name: Validate Syntax
        run: |
          python -m compileall -q gateway proxy.py health_doctor.py tg_streamer.py
          python -c "import ast,glob,sys; [ast.parse(open(f).read()) for f in glob.glob('**/*.py', recursive=True)]"

      - name: Run tests
        run: python -m pytest -q

  docker:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: python
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: apex:test