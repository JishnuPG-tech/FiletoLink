<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Abyss Spotlight</title>
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link
		href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap"
		rel="stylesheet" />
	<link rel="stylesheet" href="spotlight.css" />
</head>

<body>
	<div id="backdrop"><img id="backdrop-img" alt="" /></div>
	<div id="content">
		<div id="genres"></div>
		<img id="logo" alt="" />
		<div id="title"></div>
		<div id="episode-label"></div>
		<div id="meta"></div>
		<div id="progress-wrap" style="display:none">
			<div id="progress-bar"></div>
		</div>
		<div id="plot"></div>
		<div id="buttons"></div>
	</div>
	<div id="carousel-dots"></div>
	<button id="clickzone" type="button" aria-label="View item details"></button>
	<div id="empty" style="display:none">Nothing to show</div>

	<!-- Update notification -->
	<div id="update-toast" style="display:none" role="status" aria-live="polite">
		<div id="update-toast-inner">
			<div id="update-toast-top">
				<svg id="update-icon" xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960"
					width="24px" fill="currentColor">
					<path
						d="M480-323.39 314.31-489.08l32.61-32.23 110.39 110V-780h45.38v368.69l110.39-110 32.61 32.23L480-323.39ZM237.69-180q-23.53 0-40.61-17.08T180-237.69V-363h45.39v125.31q0 4.61 3.84 8.46 3.85 3.84 8.46 3.84h484.62q4.61 0 8.46-3.84 3.84-3.85 3.84-8.46V-363H780v125.31q0 23.53-17.08 40.61T722.31-180H237.69Z" />
				</svg>
				<span id="update-text"></span>
				<button id="update-dismiss" aria-label="Dismiss notification">
					<svg xmlns="http://www.w3.org/2000/svg" height="14px" viewBox="0 -960 960 960" width="14px"
						fill="currentColor">
						<path
							d="m256-200-56-56 224-224-224-224 56-56 224 224 224-224 56 56-224 224 224 224-56 56-224-224-224 224Z" />
					</svg>
				</button>
			</div>
			<div id="update-toast-actions">
				<a id="update-link" href="#" target="_blank" rel="noopener noreferrer">View release</a>
				<button id="update-mute" type="button">Don't show again</button>
			</div>
		</div>
	</div>

	<script>
		// Updated automatically by the installer on each install/update.
		const ABYSS_SPOTLIGHT_VERSION = '1.2.3';

		(() => {
			const $ = id => document.getElementById(id);
			const AUTO_INTERVAL = 5000;
			const REFRESH_INTERVAL = 60000;
			const FIELDS = 'Overview,RunTimeTicks,UserData,OfficialRating,CommunityRating,SeriesName,SeriesId,ParentIndexNumber,IndexNumber,PlaybackPositionTicks,ChildCount,Status,BackdropImageTags,ParentBackdropImageTags,SeriesPrimaryImageTag,SeriesThumbImageTag';
			const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
			const imageCache = new Map();
			let items = [];
			let currentIndex = 0;
			let autoTimer = null;
			let preloadTimer = null;
			let renderController = null;
			let preloadController = null;
			let refreshController = null;
			let refreshPromise = null;
			let zoomAnimation = null;
			let renderSequence = 0;
			let lastRefresh = 0;
			let paused = true;
			let disposed = false;

			const SVG_PLAY = `<svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3"><path d="M320-273v-414q0-17 12-28.5t28-11.5q5 0 10.5 1.5T381-721l326 207q9 6 13.5 15t4.5 19q0 10-4.5 19T707-446L381-239q-5 3-10.5 4.5T360-233q-16 0-28-11.5T320-273Z"/></svg>`;
			const SVG_TRAILER = `<svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3"><path d="m380-300 280-180-280-180v360ZM200-120q-33 0-56.5-23.5T120-200v-560q0-33 23.5-56.5T200-840h560q33 0 56.5 23.5T840-760v560q0 33-23.5 56.5T760-120H200Zm0-80h560v-560H200v560Zm0 0v-560 560Z"/></svg>`;
			const SVG_INFO = `<svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3"><path d="M423.5-703.5Q400-727 400-760t23.5-56.5Q447-840 480-840t56.5 23.5Q560-793 560-760t-23.5 56.5Q513-680 480-680t-56.5-23.5Zm14 566Q420-155 420-180v-360q0-25 17.5-42.5T480-600q25 0 42.5 17.5T540-540v360q0 25-17.5 42.5T480-120q-25 0-42.5-17.5Z"/></svg>`;
			const SVG_RATING = `<svg xmlns="http://www.w3.org/2000/svg" height="20px" viewBox="0 -960 960 960" width="20px" fill="#e3e3e3"><path d="M168-144q-29 0-50.5-21.5T96-216v-528q0-29.7 21.5-50.85Q139-816 168-816h624q29 0 50.5 21.15T864-744v528q0 29-21.5 50.5T792-144H168Zm337.5-154.35Q516-308.7 516-324v-168q0-15.3-10.29-25.65Q495.42-528 480.21-528t-25.71 10.35Q444-507.3 444-492v168q0 15.3 10.29 25.65Q464.58-288 479.79-288t25.71-10.35ZM480-600q14 0 25-11t11-25.5q0-14.5-11-25T479.5-672q-14.5 0-25 10.35T444-636q0 14 10.35 25T480-600ZM168-228h72v-72h-72v72Zm552 0h72v-72h-72v72ZM168-372h72v-72h-72v72Zm552 0h72v-72h-72v72ZM168-516h72v-72h-72v72Zm552 0h72v-72h-72v72ZM168-660h72v-72h-72v72Zm552 0h72v-72h-72v72Z"/></svg>`;
			const SVG_CLOCK = `<svg xmlns="http://www.w3.org/2000/svg" height="20px" viewBox="0 -960 960 960" width="20px" fill="#e3e3e3"><path d="M516-510v-174q0-15.3-10.29-25.65Q495.42-720 480.21-720t-25.71 10.35Q444-699.3 444-684v189q0 8 3 14.5t8 11.5l133.85 133.85Q600-324 614.5-324.5 629-325 640-336t11-25.5q0-14.5-11.34-25.75L516-510ZM480-96q-79.38 0-149.19-30T208.5-208.5Q156-261 126-330.96t-30-149.5Q96-560 126-630q30-70 82.5-122t122.46-82q69.96-30 149.5-30t149.55 30.24q70 30.24 121.79 82.08 51.78 51.84 81.99 121.92Q864-559.68 864-480q0 79.38-30 149.19T752-208.5Q700-156 629.87-126T480-96Z"/></svg>`;
			const SVG_STAR = `<svg xmlns="http://www.w3.org/2000/svg" height="20px" viewBox="0 -960 960 960" width="20px" fill="#e3e3e3"><path d="m480-285-164 98q-11 6-21.5 5t-18.5-7q-8-6-12-16.5t-1-21.5l43-183-145-123q-9-8-11-18.5t1-20.5q3-10 11-16.5t20-7.5l190-17 75-174q5-11 14-16.5t19-5.5q10 0 19 5.5t14 16.5l75 175 190 16q12 1 20 8t11 17q3 10 .5 20T798-533L654-410l43 183q3 11-1 21.5T684-189q-8 6-18.5 7t-21.5-5l-164-98Z"/></svg>`;
			const SVG_TV = `<svg xmlns="http://www.w3.org/2000/svg" height="20px" viewBox="0 -960 960 960" width="20px" fill="#e3e3e3"><path d="M320-120v-80H160q-33 0-56.5-23.5T80-280v-480q0-33 23.5-56.5T160-840h640q33 0 56.5 23.5T880-760v480q0 33-23.5 56.5T800-200H640v80H320Zm-160-160h640v-480H160v480Zm0 0v-480 480Z"/></svg>`;

			function isTvLayout() {
				try {
					return window.top.document.body.classList.contains('layout-tv');
				} catch {
					return false;
				}
			}

			const tvMode = isTvLayout();
			if (tvMode) document.body.classList.add('tv-mode');

			let tvActive = false;
			let tvFocusables = [];
			let tvFocusIndex = 0;

			function collectTvFocusables() {
				tvFocusables = Array.prototype.slice.call(
					document.querySelectorAll('#buttons .btn, #carousel-dots .dot')
				);
			}

			function setTvFocus(index) {
				if (!tvFocusables.length) return;
				tvFocusIndex = (index + tvFocusables.length) % tvFocusables.length;
				tvFocusables.forEach(el => el.classList.remove('tv-focused'));
				const el = tvFocusables[tvFocusIndex];
				el.classList.add('tv-focused');
				try { el.focus({ preventScroll: true }); } catch { el.focus(); }
			}

			function refreshTvFocus() {
				if (!tvMode || !tvActive) return;
				collectTvFocusables();
				setTvFocus(tvFocusIndex);
			}

			function leaveWidget(direction) {
				tvFocusables.forEach(el => el.classList.remove('tv-focused'));
				tvActive = false;
				startAuto();
				try {
					window.parent.postMessage({ type: 'abyss-spotlight', action: 'leave', direction }, window.location.origin);
				} catch { /* cross-origin parent, nothing abyss can do :) */ }
			}

			function enterTvFocus() {
				if (!tvMode || disposed || paused || tvActive) return;
				tvActive = true;
				stopAuto();
				collectTvFocusables();
				setTvFocus(0);
			}

			window.addEventListener('focus', enterTvFocus);
			document.addEventListener('focusin', enterTvFocus);

			const BACK_KEYCODES = new Set([461, 10009]); // webOS Back, Tizen Back

			document.addEventListener('keydown', event => {
				if (!tvMode || paused || disposed) return;
				switch (event.key) {
					case 'ArrowRight':
						event.preventDefault();
						setTvFocus(tvFocusIndex + 1);
						break;
					case 'ArrowLeft':
						event.preventDefault();
						setTvFocus(tvFocusIndex - 1);
						break;
					case 'Enter':
					case ' ':
						event.preventDefault();
						tvFocusables[tvFocusIndex]?.click();
						break;
					case 'ArrowDown':
						event.preventDefault();
						leaveWidget('down');
						break;
					case 'ArrowUp':
						event.preventDefault();
						leaveWidget('up');
						break;
					case 'Backspace':
					case 'Escape':
					case 'GoBack':
						event.preventDefault();
						leaveWidget('down');
						break;
					default:
						if (BACK_KEYCODES.has(event.keyCode)) {
							event.preventDefault();
							leaveWidget('down');
						}
				}
			});

			function normalizeAddress(value) {
				if (!value) return '';
				try {
					const url = new URL(value, window.location.origin);
					return `${url.origin}${url.pathname.replace(/\/+$/, '')}`;
				} catch { return ''; }
			}

			function getBaseUrl() {
				try {
					const topApi = (window.top && window.top.ApiClient) || (window.parent && window.parent.ApiClient);
					if (topApi && typeof topApi.serverAddress === 'function') {
						const addr = topApi.serverAddress();
						if (addr) return normalizeAddress(addr);
					}
				} catch (e) {}
				try {
					const loc = window.top.location;
					const match = loc.pathname.match(/^(.*?)\/web\b/);
					return normalizeAddress(`${loc.protocol}//${loc.host}${match ? match[1] : ''}`);
				} catch {
					try {
						const credentials = JSON.parse(localStorage.getItem('jellyfin_credentials'));
						const server = credentials?.Servers?.find(entry => entry.AccessToken && entry.UserId);
						return normalizeAddress(server?.ManualAddress || server?.LocalAddress || server?.RemoteAddress);
					} catch { return ''; }
				}
			}

			function getAuth(baseUrl) {
				try {
					const topApi = (window.top && window.top.ApiClient) || (window.parent && window.parent.ApiClient);
					if (topApi && typeof topApi.accessToken === 'function' && typeof topApi.getCurrentUserId === 'function') {
						const t = topApi.accessToken();
						const u = topApi.getCurrentUserId();
						if (t && u) return { token: t, userId: u };
					}
				} catch (e) {}
				try {
					let rawCreds = null;
					try {
						if (window.top && window.top.localStorage) {
							rawCreds = window.top.localStorage.getItem('jellyfin_credentials');
						}
					} catch (e) {}
					if (!rawCreds) {
						rawCreds = localStorage.getItem('jellyfin_credentials');
					}
					const credentials = JSON.parse(rawCreds || '{}');
					const servers = credentials?.Servers || [];
					const matchesBase = server => [server.ManualAddress, server.LocalAddress, server.RemoteAddress]
						.some(address => normalizeAddress(address) === baseUrl);
					const server = servers.find(entry => entry.AccessToken && entry.UserId && matchesBase(entry))
						|| servers.find(entry => entry.AccessToken && entry.UserId);
					return { token: server?.AccessToken, userId: server?.UserId };
				} catch { return {}; }
			}

			function authHeaders(token) {
				return { 'Authorization': `MediaBrowser Client="Jellyfin Web", Device="Abyss Spotlight", DeviceId="abyss-spotlight", Version="1.0", Token="${token}"` };
			}

			function formatRuntime(ticks) {
				if (!ticks) return null;
				const mins = Math.floor(ticks / 600000000);
				if (mins < 60) return `${mins}m`;
				const hours = Math.floor(mins / 60);
				const remainder = mins % 60;
				return remainder > 0 ? `${hours}h ${remainder}m` : `${hours}h`;
			}

			function metaPillWithIcon(iconSvg, text) {
				const pill = document.createElement('span');
				const label = document.createElement('span');
				pill.className = 'meta-pill';
				pill.innerHTML = iconSvg;
				label.textContent = String(text);
				pill.appendChild(label);
				return pill;
			}

			function navigateTo(route) {
				try { window.top.location.hash = route; }
				catch { window.location.hash = route; }
			}

			function imageDimensions(type) {
				const dpr = Math.max(window.devicePixelRatio || 1, 2);
				if (type === 'Logo') {
					return { width: Math.min(1920, Math.ceil(window.innerWidth * 0.75 * dpr)), height: Math.min(480, Math.ceil(160 * dpr)) };
				}
				return { width: Math.max(1920, Math.ceil(window.innerWidth * dpr)), height: Math.max(1080, Math.ceil(window.innerHeight * dpr)) };
			}

			function imageUrl(itemId, type, index = null, tag = null) {
				const suffix = index == null ? '' : `/${index}`;
				const tagParam = tag ? `&tag=${tag}` : '';
				if (type === 'Backdrop' || type === 'Thumb') {
					return `${base}/Items/${itemId}/Images/${type}${suffix}?quality=100&maxWidth=3840${tagParam}`;
				}
				const { width, height } = imageDimensions(type);
				return `${base}/Items/${itemId}/Images/${type}${suffix}?quality=100&maxWidth=${width}&maxHeight=${height}${tagParam}`;
			}

			async function fetchImage(url, signal) {
				if (imageCache.has(url)) return imageCache.get(url);
				try {
					const response = await fetch(url, { headers, signal });
					if (!response.ok) return null;
					const objectUrl = URL.createObjectURL(await response.blob());
					imageCache.set(url, objectUrl);
					return objectUrl;
				} catch (error) {
					if (error.name === 'AbortError') throw error;
					return null;
				}
			}

			function clearImageCache() {
				for (const objectUrl of imageCache.values()) URL.revokeObjectURL(objectUrl);
				imageCache.clear();
			}

			function wait(ms, signal) {
				if (ms === 0) return Promise.resolve();
				return new Promise((resolve, reject) => {
					const timer = setTimeout(resolve, ms);
					signal.addEventListener('abort', () => {
						clearTimeout(timer);
						reject(new DOMException('Aborted', 'AbortError'));
					}, { once: true });
				});
			}

			function startZoom(image) {
				zoomAnimation?.cancel();
				zoomAnimation = null;
				image.style.transform = 'scale(1) translate(0, 0)';
				if (paused || reducedMotion.matches) return;
				const isMobile = window.innerWidth <= 768 && window.innerHeight > window.innerWidth;
				if (isMobile) return;
				const angle = Math.random() * Math.PI * 2;
				const panX = Math.cos(angle) * 1.5;
				const panY = Math.sin(angle) * 1.5;
				zoomAnimation = image.animate([
					{ transform: 'scale(1) translate(0, 0)' },
					{ transform: `scale(1.08) translate(${panX}%, ${panY}%)` }
				], { duration: 9000, easing: 'linear', fill: 'forwards' });
			}

			function semverGt(a, b) {
				const current = a.split('.').map(Number);
				const installed = b.split('.').map(Number);
				for (let i = 0; i < 3; i++) {
					if ((current[i] || 0) > (installed[i] || 0)) return true;
					if ((current[i] || 0) < (installed[i] || 0)) return false;
				}
				return false;
			}

			async function isAdminUser(base, token, userId) {
				try {
					const response = await fetch(`${base}/Users/${userId}`, { headers: authHeaders(token) });
					if (!response.ok) return false;
					const data = await response.json();
					return !!data?.Policy?.IsAdministrator;
				} catch {
					// If we can't confirm admin status, err on the side of not nagging non-admins.
					return false;
				}
			}

			async function checkForUpdate(base, token, userId) {
				const sessionDismissKey = 'abyss-update-dismissed';
				const checkKey = 'abyss-update-checked-at';
				if (sessionStorage.getItem(sessionDismissKey)) return;
				if (Date.now() - Number(sessionStorage.getItem(checkKey) || 0) < 21600000) return;
				try {
					if (base && token && userId) {
						const admin = await isAdminUser(base, token, userId);
						if (!admin) return;
					}
					const response = await fetch('https://api.github.com/repos/AumGupta/abyss-jellyfin/releases/latest');
					sessionStorage.setItem(checkKey, String(Date.now()));
					if (!response.ok) return;
					const data = await response.json();
					const latest = (data.tag_name || '').replace(/^v/, '');
					if (!latest || !semverGt(latest, ABYSS_SPOTLIGHT_VERSION)) return;
					const muteKey = `abyss-update-muted-v${latest}`;
					if (localStorage.getItem(muteKey)) return;
					$('update-text').textContent = `Abyss v${latest} available, download and re-run the installer to update.`;
					$('update-link').href = data.html_url || `https://github.com/AumGupta/abyss-jellyfin/releases/tag/v${latest}`;
					$('update-toast').style.display = 'flex';
					requestAnimationFrame(() => $('update-toast').classList.add('visible'));
					const hideToast = () => {
						$('update-toast').classList.remove('visible');
						setTimeout(() => { $('update-toast').style.display = 'none'; }, 400);
					};
					$('update-dismiss').addEventListener('click', () => {
						hideToast();
						sessionStorage.setItem(sessionDismissKey, '1');
					}, { once: true });
					$('update-mute').addEventListener('click', () => {
						hideToast();
						localStorage.setItem(muteKey, '1');
					}, { once: true });
				} catch { /* Updates are optional when GitHub is unavailable. */ }
			}

			let base = getBaseUrl();
			let { token, userId } = getAuth(base);
			let headers = token ? authHeaders(token) : {};

			function syncAuth() {
				base = getBaseUrl();
				const auth = getAuth(base);
				token = auth.token;
				userId = auth.userId;
				if (token) headers = authHeaders(token);
				return Boolean(base && token && userId);
			}

			async function fetchJson(url, signal) {
				const response = await fetch(url, { headers, signal });
				return response.ok ? response.json() : {};
			}

			function shuffleArray(arr) {
				const shuffled = [...arr];
				for (let i = shuffled.length - 1; i > 0; i--) {
					const j = Math.floor(Math.random() * (i + 1));
					[shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
				}
				return shuffled;
			}

			async function fetchItems(signal) {
				const MIN_ITEMS = 6;
				const MAX_ITEMS = 8;

				// Fetch generous pools of random movies and random series from Jellyfin
				const [randomMoviesResult, randomSeriesResult, resumeResult] = await Promise.allSettled([
					fetchJson(`${base}/Users/${userId}/Items?Recursive=true&IncludeItemTypes=Movie&SortBy=Random&Limit=30&Fields=${FIELDS}&ImageTypes=Backdrop,Primary,Thumb,Logo`, signal),
					fetchJson(`${base}/Users/${userId}/Items?Recursive=true&IncludeItemTypes=Series&SortBy=Random&Limit=30&Fields=${FIELDS}&ImageTypes=Backdrop,Primary,Thumb,Logo`, signal),
					fetchJson(`${base}/Users/${userId}/Items/Resume?Limit=2&Recursive=true&IncludeItemTypes=Movie,Episode&Fields=${FIELDS}`, signal)
				]);
				if (signal.aborted) throw new DOMException('Aborted', 'AbortError');

				const picked = new Map();

				// If there is an active in-progress item, include it first so resume is convenient
				const resumeItems = resumeResult.status === 'fulfilled' ? resumeResult.value.Items || [] : [];
				for (const item of resumeItems) {
					if (item?.Id && !picked.has(item.Id)) {
						picked.set(item.Id, { ...item, _source: 'resume' });
						break; // Max 1 resume item so the top section stays a vibrant random showcase
					}
				}

				const rawMovies = randomMoviesResult.status === 'fulfilled' ? randomMoviesResult.value.Items || [] : [];
				let rawSeries = randomSeriesResult.status === 'fulfilled' ? randomSeriesResult.value.Items || [] : [];

				if (rawSeries.length === 0) {
					// Fallback in case series container wasn't directly found or episodes exist
					try {
						const fallbackEpisodes = await fetchJson(`${base}/Users/${userId}/Items?Recursive=true&IncludeItemTypes=Episode&SortBy=Random&Limit=10&Fields=${FIELDS}&ImageTypes=Backdrop,Primary,Thumb,Logo`, signal);
						if (fallbackEpisodes?.Items?.length) {
							rawSeries = fallbackEpisodes.Items;
						}
					} catch { /* optional */ }
				}

				const shuffledMovies = shuffleArray(rawMovies);
				const shuffledSeries = shuffleArray(rawSeries);

				// Interleave series and movies so both series and movies are well represented in the hero carousel
				const interleaved = [];
				const maxLen = Math.max(shuffledMovies.length, shuffledSeries.length);
				// Randomize starting type on each reload (50% chance series first, 50% movie first)
				const startWithSeries = Math.random() < 0.5;
				for (let i = 0; i < maxLen; i++) {
					const first = startWithSeries ? shuffledSeries[i] : shuffledMovies[i];
					const second = startWithSeries ? shuffledMovies[i] : shuffledSeries[i];
					if (first) interleaved.push({ ...first, _source: first.Type === 'Series' ? 'random-series' : 'random-movie' });
					if (second) interleaved.push({ ...second, _source: second.Type === 'Series' ? 'random-series' : 'random-movie' });
				}

				for (const item of interleaved) {
					if (picked.size >= MAX_ITEMS) break;
					if (item?.Id && !picked.has(item.Id)) {
						picked.set(item.Id, item);
					}
				}

				// Fallback Tier: if library has very few items, supplement with recently added items or shows
				if (picked.size < MIN_ITEMS) {
					try {
						const recentItems = await fetchJson(`${base}/Users/${userId}/Items?Limit=${MAX_ITEMS}&Recursive=true&SortBy=DateCreated&SortOrder=Descending&IncludeItemTypes=Movie,Series&Fields=${FIELDS}`, signal);
						for (const item of recentItems.Items || []) {
							if (picked.size >= MAX_ITEMS) break;
							if (item?.Id && !picked.has(item.Id)) {
								picked.set(item.Id, { ...item, _source: 'recent-fallback' });
							}
						}
					} catch (error) {
						if (error.name === 'AbortError') throw error;
					}
				}

				return [...picked.values()].slice(0, MAX_ITEMS);
			}

			function stopAuto() {
				if (autoTimer) clearTimeout(autoTimer);
				autoTimer = null;
			}

			function startAuto() {
				stopAuto();
				if (paused || disposed || items.length <= 1 || reducedMotion.matches) return;
				if (tvMode && tvActive) return; // don't yank focus while the user is navigating the widget
				autoTimer = setTimeout(async () => {
					currentIndex = (currentIndex + 1) % items.length;
					await renderItem(currentIndex);
					startAuto();
				}, AUTO_INTERVAL);
			}

			function updateDots() {
				const dots = [...$('carousel-dots').querySelectorAll('.dot')];
				dots.forEach((dot, index) => {
					const distance = Math.abs(index - currentIndex);
					dot.className = 'dot ' + (distance === 0 ? 'dot-active' : distance === 1 ? 'dot-near' : distance === 2 ? 'dot-far' : 'dot-hidden');
					dot.setAttribute('aria-current', distance === 0 ? 'true' : 'false');
				});
			}

			async function selectItem(index) {
				if (paused || disposed || items.length < 2) return;
				stopAuto();
				currentIndex = (index + items.length) % items.length;
				await renderItem(currentIndex);
				startAuto();
			}

			function buildDots() {
				try {
					const container = $('carousel-dots');
					while (container.firstChild) container.removeChild(container.firstChild);
					container.style.display = items.length > 1 ? 'flex' : 'none';
					items.forEach((_, index) => {
						const dot = document.createElement('button');
						dot.type = 'button';
						dot.className = 'dot';
						dot.setAttribute('aria-label', `Show item ${index + 1}`);
						dot.addEventListener('click', event => {
							event.stopPropagation();
							selectItem(index);
						});
						container.appendChild(dot);
					});
					updateDots();
					refreshTvFocus();
				} catch (error) {
					console.error('[Abyss Spotlight] buildDots failed:', error);
				}
			}

			function itemImageUrls(item) {
				const isEpisode = item.Type === 'Episode';
				const artworkId = isEpisode ? item.SeriesId || item.Id : item.Id;
				const tags = (item.BackdropImageTags && item.BackdropImageTags.length > 0)
					? item.BackdropImageTags
					: (item.ParentBackdropImageTags && item.ParentBackdropImageTags.length > 0 ? item.ParentBackdropImageTags : []);
				const hasBackdrop = tags.length > 0;
				let backdropIndex = 0;
				let backdropTag = tags[0] || null;

				// Dynamically rotate thumbnails/backdrops over time
				if (tags.length > 1) {
					let sessionOffset = 0;
					try {
						let s = sessionStorage.getItem('abyss_spotlight_backdrop_seed');
						if (!s) {
							s = String(Math.floor(Math.random() * 100));
							sessionStorage.setItem('abyss_spotlight_backdrop_seed', s);
						}
						sessionOffset = parseInt(s, 10) || 0;
					} catch { /* ignore */ }

					// 4-hour time slot + item character seed + session offset
					const timeSlot = Math.floor(Date.now() / (1000 * 60 * 60 * 4));
					const charSeed = (item.Id || "").split("").reduce((acc, c) => (acc * 31 + c.charCodeAt(0)) >>> 0, 0);
					backdropIndex = (timeSlot + charSeed + sessionOffset) % tags.length;
					backdropTag = tags[backdropIndex];
				}

				const hasThumb = !!(item.ImageTags?.Thumb || item.SeriesThumbImageTag);
				const thumbTag = item.ImageTags?.Thumb || item.SeriesThumbImageTag || null;
				const hasPrimary = !!(item.ImageTags?.Primary || item.SeriesPrimaryImageTag);
				const primaryTag = item.ImageTags?.Primary || item.SeriesPrimaryImageTag || null;
				const hasLogo = !!(item.ImageTags?.Logo);
				const logoTag = item.ImageTags?.Logo || null;
				return {
					primary: (hasPrimary || !item.ImageTags) ? imageUrl(artworkId, 'Primary', null, primaryTag) : null,
					backdrop: (hasBackdrop || !item.BackdropImageTags) ? imageUrl(artworkId, 'Backdrop', backdropIndex, backdropTag) : null,
					backdropFallback: (backdropIndex > 0) ? imageUrl(artworkId, 'Backdrop', 0, tags[0]) : null,
					thumb: (hasThumb || !item.ImageTags) ? imageUrl(artworkId, 'Thumb', null, thumbTag) : null,
					logo: (hasLogo || !item.ImageTags) ? imageUrl(artworkId, 'Logo', null, logoTag) : null
				};
			}

			async function fetchArtwork(item, signal) {
				const urls = itemImageUrls(item);
				const logoPromise = urls.logo ? fetchImage(urls.logo, signal) : Promise.resolve(null);
				let backdrop = null;
				let primaryBackdrop = false;
				let usedThumb = false;

				// 1. Try high-res 1080p widescreen backdrop (rotated)
				if (urls.backdrop) {
					backdrop = await fetchImage(urls.backdrop, signal);
				}

				// If rotated backdrop wasn't cached or failed, fallback to index 0
				if (!backdrop && urls.backdropFallback) {
					backdrop = await fetchImage(urls.backdropFallback, signal);
				}

				// 2. If backdrop not found, try 1080p horizontal thumb/landscape
				if (!backdrop && urls.thumb) {
					backdrop = await fetchImage(urls.thumb, signal);
					if (backdrop) usedThumb = true;
				}

				// 3. Fallback to Primary poster only if neither horizontal asset exists
				if (!backdrop && urls.primary) {
					backdrop = await fetchImage(urls.primary, signal);
					primaryBackdrop = true;
				}

				// 4. For Series, if still no backdrop, check if any season or episode has backdrop or thumb
				if (!backdrop && item.Type === 'Series') {
					try {
						const children = await fetchJson(`${base}/Shows/${item.Id}/Episodes?Limit=1&Fields=Overview,ParentBackdropImageTags,SeriesPrimaryImageTag`, signal);
						const ep = children.Items && children.Items[0];
						if (ep) {
							const epUrls = itemImageUrls(ep);
							if (epUrls.backdrop) backdrop = await fetchImage(epUrls.backdrop, signal);
							if (!backdrop && epUrls.thumb) {
								backdrop = await fetchImage(epUrls.thumb, signal);
								if (backdrop) usedThumb = true;
							}
							if (!backdrop && epUrls.primary) {
								backdrop = await fetchImage(epUrls.primary, signal);
								primaryBackdrop = true;
							}
						}
					} catch { /* optional fallback */ }
				}

				return { backdrop, logo: await logoPromise, primaryBackdrop, usedThumb };
			}

			function queuePreload() {
				if (preloadTimer) clearTimeout(preloadTimer);
				preloadController?.abort();
				if (paused || items.length <= 1) return;
				preloadController = new AbortController();
				const next = items[(currentIndex + 1) % items.length];
				preloadTimer = setTimeout(() => {
					fetchArtwork(next, preloadController.signal).catch(() => { });
				}, 250);
			}

			async function renderItem(index) {
				const item = items[index];
				if (!item || paused || disposed) return false;
				renderController?.abort();
				renderController = new AbortController();
				const { signal } = renderController;
				const sequence = ++renderSequence;
				updateDots();
				try {
					const artwork = await fetchArtwork(item, signal);
					if (signal.aborted || sequence !== renderSequence) return false;
					$('content').classList.remove('visible');
					$('backdrop').classList.remove('loaded');
					await wait(reducedMotion.matches ? 0 : 260, signal);
					if (signal.aborted || sequence !== renderSequence) return false;
					try {
						updateContent(item, artwork);
					} catch (error) {
						console.error('[Abyss Spotlight] updateContent error:', error);
					}
					$('content').classList.add('visible');
					refreshTvFocus();
					queuePreload();
					return true;
				} catch (error) {
					if (error.name !== 'AbortError') console.error('[Abyss Spotlight] render error:', error);
					return false;
				}
			}

			async function refreshItems() {
				if (refreshPromise) return refreshPromise;
				refreshController?.abort();
				refreshController = new AbortController();
				refreshPromise = (async () => {
					const currentId = items[currentIndex]?.Id;
					const nextItems = await fetchItems(refreshController.signal);
					if (paused || disposed) return;
					items = nextItems;
					lastRefresh = Date.now();
					currentIndex = Math.max(0, items.findIndex(item => item.Id === currentId));
					$('empty').style.display = items.length ? 'none' : 'flex';
					buildDots();
					if (items.length) await renderItem(currentIndex);
				})();
				try { await refreshPromise; }
				catch (error) { if (error.name !== 'AbortError') console.error('[Abyss Spotlight] refresh error:', error); }
				finally { refreshPromise = null; }
			}

			function pause() {
				if (paused || disposed) return;
				paused = true;
				stopAuto();
				if (preloadTimer) clearTimeout(preloadTimer);
				preloadTimer = null;
				renderController?.abort();
				preloadController?.abort();
				refreshController?.abort();
				zoomAnimation?.cancel();
				zoomAnimation = null;
				if (tvMode && tvActive) leaveWidget('down');
			}

			let authRetryCount = 0;
			async function resume() {
				if (disposed) return;
				if (!base || !token || !userId) {
					if (!syncAuth()) {
						if (authRetryCount < 15) {
							authRetryCount++;
							setTimeout(resume, 350);
							return;
						}
						$('empty').style.display = 'flex';
						return;
					}
				}
				$('empty').style.display = 'none';
				const wasPaused = paused;
				paused = false;
				if (!items.length || Date.now() - lastRefresh > REFRESH_INTERVAL) await refreshItems();
				else if (wasPaused) await renderItem(currentIndex);
				startAuto();
			}

			function dispose() {
				if (disposed) return;
				disposed = true;
				paused = true;
				stopAuto();
				if (preloadTimer) clearTimeout(preloadTimer);
				renderController?.abort();
				preloadController?.abort();
				refreshController?.abort();
				zoomAnimation?.cancel();
				clearImageCache();
			}

			let touchStartX = 0;
			let touchStartY = 0;
			let touchTargetIsInteractive = false;
			document.addEventListener('touchstart', event => {
				const touch = event.changedTouches[0];
				touchStartX = touch.screenX;
				touchStartY = touch.screenY;
				touchTargetIsInteractive = Boolean(event.target.closest('button, a, input, select, textarea'));
			}, { passive: true });
			document.addEventListener('touchend', event => {
				if (touchTargetIsInteractive || paused || items.length < 2) return;
				const touch = event.changedTouches[0];
				const deltaX = touch.screenX - touchStartX;
				const deltaY = touch.screenY - touchStartY;
				if (Math.abs(deltaX) < 50 || Math.abs(deltaX) <= Math.abs(deltaY)) return;
				selectItem(currentIndex + (deltaX < 0 ? 1 : -1));
			}, { passive: true });

			window.addEventListener('message', event => {
				if (event.source !== window.parent || event.origin !== window.location.origin || event.data?.type !== 'abyss-spotlight') return;
				const { action } = event.data;
				if (action === 'pause') pause();
				if (action === 'resume') resume();
				if (action === 'tv-focus') enterTvFocus();
			});
			document.addEventListener('visibilitychange', () => { document.hidden ? pause() : resume(); });
			window.addEventListener('pagehide', dispose, { once: true });
			reducedMotion.addEventListener?.('change', () => {
				if (reducedMotion.matches) {
					zoomAnimation?.cancel();
					zoomAnimation = null;
					stopAuto();
				} else if (!paused) {
					startZoom($('backdrop-img'));
					startAuto();
				}
			});

			if (!document.hidden) resume();
			if (base && token && userId) checkForUpdate(base, token, userId);
		})();
	</script>
</body>
